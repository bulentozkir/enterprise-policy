apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sazurev4noprivilegeescalation
spec:
  crd:
    spec:
      names:
        kind: K8sAzureV4NoPrivilegeEscalation
      validation:
        # Schema for the `parameters` field
        openAPIV3Schema:
          properties:
            forcePrivilegeEscalationToBeFalse:
              description: ->
                If set to true, then `allowPrivilegeEscalation` must explicitly be set to false 
                regardless of the `runAsUser` field in the container securityContext.
                This will make this policy follow the behavior of the Kubernetes Pod Security Standard
                of No Privilege Escalation
              type: boolean
            excludedContainers:
              type: array
              items:
                type: string
            excludedImages:
              description: >-
                Any container that uses an image that matches an entry in this list will be excluded
                from enforcement. Prefix-matching can be signified with `*`. For example: `my-image-*`.
                It is recommended that users use the fully-qualified Docker image name (e.g. start with a domain name)
                in order to avoid unexpectedly excluding images from an untrusted repository.
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sazurev4noprivilegeescalation

        import data.lib.exclude_container_image.is_excluded

        # The following scenerios will be viewed as violations. Windows containers are not supported
        ## allowPrivilegeEscalation=true
        ## runAsUser != 0 + missing allowPrivilegeEscalation=false

        violation[{"msg": msg, "details": {}}] {
            not input.review.object.spec.nodeSelector["kubernetes.io/os"] == "windows"
            c := input_containers[_]
            not input_container_excluded(c.name)
            not is_excluded(c)
            input_allow_privilege_escalation(c)
            msg := sprintf("Privilege escalation container is not allowed: %v. For more information, visit https://aka.ms/aks/deployment-safeguards", [c.name])
        }

        violation[{"msg": msg, "details": {}}] {
            not input.review.object.spec.nodeSelector["kubernetes.io/os"] == "windows"
            input.parameters.forcePrivilegeEscalationToBeFalse == true
            c := input_containers[_]
            not input_container_excluded(c.name)
            not is_excluded(c)
            not c.securityContext.allowPrivilegeEscalation == false
            msg := sprintf("Container %v is required to explicitly set securityContext.allowPrivilegeEscalation to false. For more information, visit https://aka.ms/aks/deployment-safeguards", [c.name])
        }

        input_allow_privilege_escalation(c) {
            c.securityContext.allowPrivilegeEscalation == true
        }
        input_allow_privilege_escalation(c) {
            not c.securityContext.allowPrivilegeEscalation == false
            c.securityContext.runAsUser != 0
        }
        input_allow_privilege_escalation(c) {
            not c.securityContext.allowPrivilegeEscalation == false
            not c.securityContext.runAsUser
            input.review.object.spec.securityContext.runAsUser != 0
        }
        input_containers[c] {
            c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
            c := input.review.object.spec.initContainers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
        input_container_excluded(field) {
            field == input.parameters.excludedContainers[_]
        }
      libs:
        - |
          package lib.exclude_container_image
          is_excluded(container) {
              exclude_images := object.get(object.get(input, "parameters", {}), "excludedImages", [])
              img := container.image
              exclusion := exclude_images[_]
              _matches_exclusion(img, exclusion)
          }
          _matches_exclusion(img, exclusion) {
              not endswith(exclusion, "*")
              exclusion == img
          }
          _matches_exclusion(img, exclusion) {
              endswith(exclusion, "*")
              prefix := trim_suffix(exclusion, "*")
              startswith(img, prefix)
          }
