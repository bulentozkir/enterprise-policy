apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sazurev5hostfilesystem
spec:
  crd:
    spec:
      names:
        kind: K8sAzureV5HostFilesystem
      validation:
        # Schema for the `parameters` field
        openAPIV3Schema:
          properties:
            allowedHostPaths:
              type: array
              description: >-
                List of allowed hostPath volume path prefixes and their readOnly settings.
                If a hostPath volume is mounted on a container that is not excluded, it must match
                one of the entries in this list. If the entry has `readOnly: true`, the volume must
                be mounted as readOnly on all containers that use it.
              items:
                type: object
                properties:
                  readOnly:
                    type: boolean
                  pathPrefix:
                    type: string
            windowsAllowedHostPaths:
              type: array
              description: >-
                If the pod is scheduled to a Windows node (i.e. nodeSelector
                `kubernetes.io/os: windows`), this list will be used instead of `allowedHostPaths`.
                If this field is empty or not specified, `allowedHostPaths` will be used for Windows pods as well. Use "C:\"
                to allow all windows host paths.
              items:
                type: object
                properties:
                  readOnly:
                    type: boolean
                  pathPrefix:
                    type: string
            blockSocketMountPaths:
              type: boolean
              description: >-
                Controls whether hostPath volumes that expose a container runtime endpoint are
                denied regardless of any `allowedHostPaths`/`windowsAllowedHostPaths` entry and
                regardless of `readOnly`. This covers `hostPath.type: Socket` volumes and volumes
                whose path is, is under, or is an ancestor of a known runtime socket path (e.g.
                `/run/containerd`, `/var/run/containerd`, their `containerd.sock`, or CRI-O/docker
                sockets). Access to a runtime socket is equivalent to node root, and a `readOnly`
                mount does not restrict socket traffic. Defaults to `true` in v5 (secure by
                default); set it to `false` to intentionally permit runtime socket paths via the
                allow list.
            excludedContainers:
              type: array
              items:
                type: string
            excludedImages:
              type: array
              items:
                type: string
              description: >-
                Any container that uses an image that matches an entry in this list will be excluded
                from enforcement. Prefix-matching can be signified with `*`. For example: `my-image-*`.
                It is recommended that users use the fully-qualified Docker image name (e.g. start with a domain name)
                in order to avoid unexpectedly excluding images from an untrusted repository.
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sazurev5hostfilesystem

        import data.lib.exclude_container_image.is_excluded

        # The following scenario will be viewed as non-compliant:
        ## exist hostPath volume mounted on container not in the allowed list
        ## hostPath is set readonly but mounted as writable

        # disallowed due to not in allowed paths
        violation[{"msg": msg, "details": {}}] {
            volume := input_hostpath_volumes[_]
            allowedPaths := get_allowed_paths(input)
            not input_hostpath_allowed(allowedPaths, volume)
            msg := sprintf("HostPath volume %v is not allowed, pod: %v. Allowed path: %v. For more information, visit https://aka.ms/aks/deployment-safeguards", [volume, input.review.object.metadata.name, allowedPaths])
        }

        # disallowed due to mounted as writeable
        violation[{"msg": msg, "details": {}}] {
            volume := input_hostpath_volumes[_]
            allowedPaths := get_allowed_paths(input)
            allowedHostPath := allowedPaths[_]
            allowedHostPath.readOnly
            path_matches(allowedHostPath.pathPrefix, volume.hostPath.path)
            writeable_input_volume_mounts(volume.name)
            msg := sprintf("HostPath volume %v does not meet the readonly requirement, pod: %v. Allowed path: %v. For more information, visit https://aka.ms/aks/deployment-safeguards", [volume, input.review.object.metadata.name, allowedPaths])
         }

         # disallowed because the hostPath exposes a container runtime endpoint.
         # A `readOnly` bind mount does not restrict AF_UNIX traffic to a runtime
         # socket (e.g. containerd.sock), so read-only is not sufficient protection.
         # This is enforced by default in v5; set `blockSocketMountPaths: false` to
         # intentionally permit runtime socket paths through the allow list.
         violation[{"msg": msg, "details": {}}] {
             block_socket_mount_paths
             volume := input_hostpath_volumes[_]
             is_runtime_socket_volume(volume)
             msg := sprintf("HostPath volume %v exposes a container runtime endpoint and is blocked, pod: %v. Access to a runtime socket is equivalent to node root and is not made safe by readOnly. Set blockSocketMountPaths to false to permit it. For more information, visit https://aka.ms/aks/deployment-safeguards", [volume, input.review.object.metadata.name])
         }

         # Secure by default: enforce unless the operator explicitly opts out with
         # blockSocketMountPaths == false.
         block_socket_mount_paths {
             not input.parameters.blockSocketMountPaths == false
         }

         # A hostPath is a runtime endpoint if it is declared with type Socket, or if
         # its path is (or is under) a known runtime socket path.
         is_runtime_socket_volume(volume) {
             volume.hostPath.type == "Socket"
         }
         is_runtime_socket_volume(volume) {
             runtime_socket_path[prefix]
             path_matches(prefix, volume.hostPath.path)
         }
         # Also matches when the mounted path is an ancestor of a runtime socket
         # path (e.g. mounting "/run" exposes "/run/containerd"). The root path "/"
         # is excluded because it would match every prefix; "/" exposure is already
         # governed by the allowedHostPaths rules.
         is_runtime_socket_volume(volume) {
             volume.hostPath.path != "/"
             runtime_socket_path[prefix]
             path_matches(volume.hostPath.path, prefix)
         }

         # Known AKS container runtime socket directories and socket paths.
         runtime_socket_path["/run/containerd"]
         runtime_socket_path["/var/run/containerd"]
         runtime_socket_path["/run/containerd/containerd.sock"]
         runtime_socket_path["/var/run/containerd/containerd.sock"]
         runtime_socket_path["/run/crio"]
         runtime_socket_path["/var/run/crio"]
         runtime_socket_path["/run/crio/crio.sock"]
         runtime_socket_path["/var/run/crio/crio.sock"]
         runtime_socket_path["/run/dockershim.sock"]
         runtime_socket_path["/var/run/dockershim.sock"]
         runtime_socket_path["/run/docker.sock"]
         runtime_socket_path["/var/run/docker.sock"]

         # OS detection helper
         is_windows_pod {
             input.review.object.spec.nodeSelector["kubernetes.io/os"] == "windows"
         }

         # Path normalization for cross-platform support
         normalize_path(path) = normalized {
             is_windows_pod
             # Convert backslashes to forward slashes and make lowercase for Windows
             normalized := lower(replace(path, "\\", "/"))
         }

         normalize_path(path) = path {
             not is_windows_pod
         }

         get_allowed_paths(arg) = out {
             not arg.parameters
             out = []
         }
         get_allowed_paths(arg) = out {
             is_windows_pod
             not arg.parameters.windowsAllowedHostPaths
             not arg.parameters.allowedHostPaths
             out = []
         }
         get_allowed_paths(arg) = out {
             is_windows_pod
             arg.parameters.windowsAllowedHostPaths
             out = arg.parameters.windowsAllowedHostPaths
         }
         get_allowed_paths(arg) = out {
             is_windows_pod
             not arg.parameters.windowsAllowedHostPaths
             arg.parameters.allowedHostPaths
             out = arg.parameters.allowedHostPaths
         }
         get_allowed_paths(arg) = out {
             not is_windows_pod
             not arg.parameters.allowedHostPaths
             out = []
         }
         get_allowed_paths(arg) = out {
             not is_windows_pod
             out = arg.parameters.allowedHostPaths
         }

         input_hostpath_allowed(allowedPaths, volume) {
             allowedHostPath := allowedPaths[_]
             path_matches(allowedHostPath.pathPrefix, volume.hostPath.path)
         }

         # This allows "/foo", "/foo/", "/foo/bar" etc., but
         # disallows "/fool", "/etc/foo" etc.
         # Updated to handle both Windows and Linux paths
         path_matches(prefix, path) {
             normalized_prefix := normalize_path(prefix)
             normalized_path := normalize_path(path)
             a := path_array(normalized_prefix)
             b := path_array(normalized_path)
             prefix_matches(a, b)
         }

        writeable_input_volume_mounts(volume_name) {
            container := input_containers[_]
            not is_excluded(container)
            not input_container_excluded(container.name)
            mount := container.volumeMounts[_]
            mount.name == volume_name
            not mount.readOnly
        }

        path_array(p) = out {
            p != "/"
            # Handle Windows drive letters (e.g., "C:/Windows" -> ["C:", "Windows"])
            contains(p, ":")
            drive_and_path := split(p, ":")
            count(drive_and_path) == 2
            drive := sprintf("%s:", [drive_and_path[0]])
            path_part := trim(drive_and_path[1], "/")
            path_part != ""
            out := array.concat([drive], split(path_part, "/"))
        }
        path_array(p) = out {
            p != "/"
            # Handle Windows drive letters with no additional path (e.g., "C:" -> ["C:"])
            contains(p, ":")
            drive_and_path := split(p, ":")
            count(drive_and_path) == 2
            drive := sprintf("%s:", [drive_and_path[0]])
            path_part := trim(drive_and_path[1], "/")
            path_part == ""
            out := [drive]
        }
        path_array(p) = out {
            p != "/"
            # Handle regular paths (Unix or Windows without drive)
            not contains(p, ":")
            out := split(trim(p, "/"), "/")
        }
        # This handles the special case for "/", since
        # split(trim("/", "/"), "/") == [""]
        path_array("/") = []

        prefix_matches(a, b) {
            count(a) <= count(b)
            not any_not_equal_upto(a, b, count(a))
        }

        any_not_equal_upto(a, b, n) {
            a[i] != b[i]
            i < n
        }

        input_hostpath_volumes[v] {
            v := mounted_volumes[_]
            has_field(v, "hostPath")
        }

        mounted_volumes[volumes] {
            container := input_containers[_]
            not is_excluded(container)
            not input_container_excluded(container.name)
            volumeNames := {x | x := container.volumeMounts[_].name}
            volumes := {x | x := input.review.object.spec.volumes[_]; x.name == volumeNames[_]}[_]
        }

        # has_field returns whether an object has a field
        has_field(object, field) = true {
            object[field]
        }
        input_containers[c] {
            c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
            c := input.review.object.spec.initContainers[_]
        }

        input_containers[c] {
            c := input.review.object.spec.ephemeralContainers[_]
        }

        input_container_excluded(field) {
            field == input.parameters.excludedContainers[_]
        }
      libs:
        - |
          package lib.exclude_container_image
          is_excluded(container) {
              exclude_images := object.get(object.get(input, "parameters", {}), "excludedImages", [])
              img := container.image
              exclusion := exclude_images[_]
              _matches_exclusion(img, exclusion)
          }
          _matches_exclusion(img, exclusion) {
              not endswith(exclusion, "*")
              exclusion == img
          }
          _matches_exclusion(img, exclusion) {
              endswith(exclusion, "*")
              prefix := trim_suffix(exclusion, "*")
              startswith(img, prefix)
          }
