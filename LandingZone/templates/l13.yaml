apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sazurev5hostnetworkingports
spec:
  crd:
    spec:
      names:
        kind: K8sAzureV5HostNetworkingPorts
      validation:
        # Schema for the `parameters` field
        openAPIV3Schema:
          properties:
            allowHostNetwork:
              type: boolean
            allowedHostPorts:
              type: array
              items:
                type: string
            excludedImages:
              description: >-
                Any container that uses an image that matches an entry in this list will be excluded
                from enforcement. Prefix-matching can be signified with `*`. For example: `my-image-*`.
                It is recommended that users use the fully-qualified Docker image name (e.g. start with a domain name)
                in order to avoid unexpectedly excluding images from an untrusted repository.
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sazurev5hostnetworkingports

        default VALID_PORT_RANGE = "[0-9]+-[0-9]+"

        import data.lib.exclude_container_image.is_excluded

        violation[{"msg": msg, "details": {}}] {
            container := input_containers[_]
            not is_excluded(container)
            input_share_hostnetwork(container)
            msg := sprintf("The specified hostNetwork and hostPort are not allowed, pod: %v, container: %v. Allowed values: %v. For more information, visit https://aka.ms/aks/deployment-safeguards", [input.review.object.metadata.name, container.name, input.parameters])
        }

        # hostNetwork is a Linux pod concept that is not applicable to Windows pods,
        # so the hostNetwork check is only enforced for non-Windows pods.
        input_share_hostnetwork(_) {
            not input.parameters.allowHostNetwork
            not input.review.object.spec.nodeSelector["kubernetes.io/os"] == "windows"
            input.review.object.spec.hostNetwork
        }

        # hostPort is honored on Windows nodes through HNS port mapping, so the
        # hostPort check must be enforced for every pod regardless of the OS node
        # selector. The caller-controlled nodeSelector must not skip this check.
        input_share_hostnetwork(container) {
            hostPort := container.ports[_].hostPort
            not allowed_host_port(hostPort)
        }

        # Port must be in the allowed list or within an allowed range
        allowed_host_port(port) {
            port != 0  # Port 0 is not allowed according to Pod Security Standards
            format_int(port, 10, portstr)
            allowedPort := input.parameters.allowedHostPorts[_]
            within_port_range(portstr, allowedPort)
        }

        # Check if port is within a range like "1000-2000"
        within_port_range(portstr, allowedPort) {
            regex.match(VALID_PORT_RANGE, allowedPort)
            allowedPortRange := split(allowedPort, "-")
            to_number(portstr) >= to_number(allowedPortRange[0])
            to_number(portstr) <= to_number(allowedPortRange[1])
        }

        # Check if port matches exactly (for individual ports)
        within_port_range(portstr, allowedPort) {
            not regex.match(VALID_PORT_RANGE, allowedPort)
            portstr == allowedPort
        }

        input_containers[c] {
            c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
            c := input.review.object.spec.initContainers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
      libs:
        - |
          package lib.exclude_container_image
          is_excluded(container) {
              exclude_images := object.get(object.get(input, "parameters", {}), "excludedImages", [])
              img := container.image
              exclusion := exclude_images[_]
              _matches_exclusion(img, exclusion)
          }
          _matches_exclusion(img, exclusion) {
              not endswith(exclusion, "*")
              exclusion == img
          }
          _matches_exclusion(img, exclusion) {
              endswith(exclusion, "*")
              prefix := trim_suffix(exclusion, "*")
              startswith(img, prefix)
          }